<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1, h2 { text-align: center; color: white; margin-bottom: 25px; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      margin-bottom: 40px;
    }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; font-size: 14px; }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }
    input.error { border-color: #e53e3e; }
    .error-msg { color: #e53e3e; font-size: 13px; margin-top: 4px; display: none; }
    .row { display: flex; gap: 20px; }
    .row .form-group { flex: 1; }
    .checkbox-group { display: flex; align-items: center; gap: 10px; margin: 20px 0; }
    .checkbox-group input { width: auto; }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.95; }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    .alert {
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
    }
    .alert.success { background: #c6f6d5; color: #22543d; }
    .alert.error { background: #fed7d7; color: #9b2c2c; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #f7fafc; font-weight: 600; }
    .status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: #c6f6d5;
      color: #22543d;
    }
    .empty-msg { text-align: center; color: #718096; padding: 30px; }
    @media (max-width: 600px) { .row { flex-direction: column; gap: 0; } }
  </style>
</head>
<body>

  <div class="container">
    <h1>Create Account</h1>
    <p style="text-align:center; color:white; margin-top:-15px; margin-bottom:25px;">
      Already have an account? <a href="login.html" style="color:#ffd700; font-weight:600;">Login here</a>
    </p>

    <div class="card">
      <div class="alert" id="alertBox"></div>

      <form id="regForm" novalidate>
        <div class="row">
          <div class="form-group">
            <label for="fullname">Full Name *</label>
            <input type="text" id="fullname" name="fullname" placeholder="John Doe">
            <div class="error-msg" id="fullnameError">Full name is required</div>
          </div>
          <div class="form-group">
            <label for="username">Username *</label>
            <input type="text" id="username" name="username" placeholder="johndoe">
            <div class="error-msg" id="usernameError">Username is required (min 3 characters)</div>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" placeholder="john@example.com">
          <div class="error-msg" id="emailError">Please enter a valid email</div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" name="password" placeholder="••••••••">
            <div class="error-msg" id="passwordError">Password must be at least 6 characters</div>
          </div>
          <div class="form-group">
            <label for="confirm">Confirm Password *</label>
            <input type="password" id="confirm" name="confirm" placeholder="••••••••">
            <div class="error-msg" id="confirmError">Passwords do not match</div>
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="+1 234 567 890">
          </div>
          <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="terms" name="terms">
          <label for="terms" style="margin:0; font-weight:500;">I agree to the Terms & Conditions *</label>
        </div>
        <div class="error-msg" id="termsError" style="margin-top:-10px; margin-bottom:15px;">
          You must accept the terms
        </div>

        <button type="submit" id="submitBtn">Register Now</button>
      </form>
    </div>

    <h2>Registered Users</h2>
    <div class="card">
      <div id="tableContainer">
        <p class="empty-msg">Loading users...</p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('regForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type = 'success') {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      alertBox.style.display = 'block';
      setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
    }

    function showError(inputId, errorId, show) {
      const input = document.getElementById(inputId);
      const error = document.getElementById(errorId);
      if (show) {
        input.classList.add('error');
        error.style.display = 'block';
      } else {
        input.classList.remove('error');
        error.style.display = 'none';
      }
    }

    function validateForm() {
      let isValid = true;
      const fullname = document.getElementById('fullname').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const terms = document.getElementById('terms').checked;

      if (fullname === '') { showError('fullname', 'fullnameError', true); isValid = false; }
      else { showError('fullname', 'fullnameError', false); }

      if (username.length < 3) { showError('username', 'usernameError', true); isValid = false; }
      else { showError('username', 'usernameError', false); }

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) { showError('email', 'emailError', true); isValid = false; }
      else { showError('email', 'emailError', false); }

      if (password.length < 6) { showError('password', 'passwordError', true); isValid = false; }
      else { showError('password', 'passwordError', false); }

      if (password !== confirm || confirm === '') { showError('confirm', 'confirmError', true); isValid = false; }
      else { showError('confirm', 'confirmError', false); }

      if (!terms) {
        document.getElementById('termsError').style.display = 'block';
        isValid = false;
      } else {
        document.getElementById('termsError').style.display = 'none';
      }

      return isValid;
    }

    ['fullname', 'username', 'email', 'password', 'confirm'].forEach(id => {
      document.getElementById(id).addEventListener('input', function () {
        this.classList.remove('error');
        const errorEl = document.getElementById(id + 'Error');
        if (errorEl) errorEl.style.display = 'none';
      });
    });

    async function loadUsers() {
      try {
        const response = await fetch('get_users.php');
        const data = await response.json();
        const container = document.getElementById('tableContainer');

        if (!data.success || data.users.length === 0) {
          container.innerHTML = '<p class="empty-msg">No users registered yet.</p>';
          return;
        }

        let html = `
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Full Name</th>
                <th>Username</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Gender</th>
                <th>Registered</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
        `;

        data.users.forEach((user, index) => {
          html += `
            <tr>
              <td>${index + 1}</td>
              <td>${user.fullname}</td>
              <td>${user.username}</td>
              <td>${user.email}</td>
              <td>${user.phone || '-'}</td>
              <td>${user.gender || '-'}</td>
              <td>${user.registered_at || '-'}</td>
              <td><span class="status">Active</span></td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
      } catch (err) {
        document.getElementById('tableContainer').innerHTML =
          '<p class="empty-msg">Could not load users.</p>';
      }
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!validateForm()) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Registering...';

      const formData = new FormData(form);

      try {
        const response = await fetch('register.php', {
          method: 'POST',
          body: formData
        });
        const result = await response.json();

        if (result.success) {
          showAlert(result.message, 'success');
          form.reset();
          setTimeout(() => {
            window.location.href = result.redirect || 'profile.php';
          }, 1500);
        } else {
          showAlert(result.message, 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Register Now';
        }
      } catch (error) {
        showAlert('Server error. Check if PHP is working.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register Now';
      }
    });

    loadUsers();
  </script>
</body>
</html>
