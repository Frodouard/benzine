<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    }
    h1 { text-align: center; color: #2d3748; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #718096; margin-bottom: 30px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; font-size: 14px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { opacity: 0.95; }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    .alert {
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
    }
    .alert.error { background: #fed7d7; color: #9b2c2c; }
    .alert.success { background: #c6f6d5; color: #22543d; }
    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }
    .links a { color: #667eea; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Login to your account</p>

    <div class="alert" id="alertBox"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" id="submitBtn">Login</button>
    </form>

    <div class="links">
      Don't have an account? <a href="index.html">Register here</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className = `alert ${type}`;
      alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      const formData = new FormData(form);

      try {
        const res = await fetch('login.php', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success) {
          showAlert(data.message, 'success');
          setTimeout(() => {
            window.location.href = data.redirect || 'profile.php';
          }, 1000);
        } else {
          showAlert(data.message, 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Login';
        }
      } catch (err) {
        showAlert('Server error. Make sure PHP is running.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
